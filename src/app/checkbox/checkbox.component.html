<label class="basicui-checkbox" [class.basicui-checkbox--checked]="checked" [attr.for]="id"
[ngClass]="{
  ' basicui-checkbox--theme-default': theme === 'default',
  ' basicui-checkbox--theme-primary': theme === 'primary',
  ' basicui-checkbox--theme-danger': theme === 'danger',
  ' basicui-checkbox--theme-secondary': theme === 'secondary',
  ' basicui-checkbox--theme-success': theme === 'success',
  'basicui-checkbox--theme-warning': theme === 'warning',
}">
  <input type="checkbox" class="basicui-checkbox__input" [checked]="checked" (change)="onCheckboxChange($event)"/>
  <span class="basicui-checkbox__span">{{label}}</span>
</label>
