<div [ngClass]="{
  'basicui-tabs': true,
  'basicui-tabs--shape-default': shape === 'default',
  'basicui-tabs--shape-round': shape === 'round',
  'basicui-tabs--shape-rectangle': shape === 'rectangle',
  'basicui-tabs--offset':true,
  'basicui-tabs--theme-default': theme === 'default',
  'basicui-tabs--theme-primary': theme === 'primary',
  'basicui-tabs--theme-danger': theme === 'danger',
  'basicui-tabs--theme-secondary': theme === 'secondary',
  'basicui-tabs--theme-success': theme === 'success',
  'basicui-tabs--theme-warning': theme === 'warning',
}
">
  <ul class="basicui-tabs__ul">
    <li *ngFor="let tab of tabs" 
    [ngClass]="{
      'basicui-tabs__ul__li':true, 
      'basicui-tabs__ul__li--active': tab.id === activeTabId
      }">
      <button class="basicui-tabs__ul__li__button" (click)="changeTab(tab.id)">
        <svg height="16" viewBox="0 0 16 16" version="1.1" width="16" aria-hidden="true" class="checkmark"
          *ngIf="tab.id === checkmarkTabId">
          <path fillRule="evenodd"
            d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z">
          </path>
        </svg>
        {{ tab.header }}
      </button>
    </li>
  </ul>
  <div *ngFor="let tab of tabs">
    <ng-container *ngIf="tab.id === activeTabId">
      <div>{{ tab.content }}</div>
    </ng-container>
  </div>
</div>
